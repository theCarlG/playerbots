# Full config fixture for Phase D parser tests.
# Every value here is deliberately non-default so the `full_parses_to_overrides`
# test can assert that each field was populated from the file rather than the
# default in `BotConfig::from_raw`. Grouped to mirror the order of declarations
# in `typed.rs`.
#
# When adding a new field to `BotConfig`, add a non-default line here *and* an
# assertion in `tests/config_parse.rs::full_parses_to_overrides` so the new
# field is guaranteed to round-trip through the parser.

[AiPlayerbotConf]
ConfVersion=2020072501

# ── master switches ────────────────────────────────────────────────
AiPlayerbot.Enabled = 1
AiPlayerbot.AllowGuildBots = 0
AiPlayerbot.AllowMultiAccountAltBots = 0

# ── timing scalars ─────────────────────────────────────────────────
AiPlayerbot.GlobalCooldown = 750
AiPlayerbot.ReactDelay = 200
AiPlayerbot.MaxWaitForMove = 5000
AiPlayerbot.ExpireActionTime = 9000
AiPlayerbot.DispelAuraDuration = 3000
AiPlayerbot.PassiveDelay = 6000
AiPlayerbot.RepeatDelay = 7000
AiPlayerbot.ErrorDelay = 8000
AiPlayerbot.RpgDelay = 4000
AiPlayerbot.SitDelay = 45000
AiPlayerbot.ReturnDelay = 9500
AiPlayerbot.LootDelayDelay = 900

# ── distance / range scalars ───────────────────────────────────────
AiPlayerbot.SightDistance = 80.0
AiPlayerbot.SpellDistance = 27.5
AiPlayerbot.ReactDistance = 160.0
AiPlayerbot.GrindDistance = 82.0
AiPlayerbot.LootDistance = 28.0
AiPlayerbot.HealDistance = 130.0
AiPlayerbot.AggroDistance = 24.0

# ── health / mana thresholds ───────────────────────────────────────
AiPlayerbot.CriticalHealth = 25
AiPlayerbot.LowHealth = 55
AiPlayerbot.MediumHealth = 75
AiPlayerbot.AlmostFullHealth = 95
AiPlayerbot.LowMana = 20
AiPlayerbot.MediumMana = 45

# ── random bots: population ────────────────────────────────────────
AiPlayerbot.RandomBotAutologin = 0
AiPlayerbot.RandomBotMaps = 0,1,530
AiPlayerbot.RandomBotQuestItems = 1234,5678
AiPlayerbot.RandomBotSpellIds = 99,100,101
AiPlayerbot.EnableRandomTeleports = 0
AiPlayerbot.RandomBotTeleportDistance = 1500
AiPlayerbot.RandomGearMaxLevel = 450
AiPlayerbot.MinRandomBots = 10
AiPlayerbot.MaxRandomBots = 100
AiPlayerbot.RandomBotUpdateInterval = 2000

# ── broadcasts ─────────────────────────────────────────────────────
AiPlayerbot.EnableBroadcasts = 1
AiPlayerbot.BroadcastToGuildGlobalChance = 25
AiPlayerbot.BroadcastToWorldGlobalChance = 30

# ── commands / chat ────────────────────────────────────────────────
AiPlayerbot.CommandPrefix = "!"
AiPlayerbot.CommandSeparator = " "
AiPlayerbot.RandomBotAccountPrefix = "TEST_"
AiPlayerbot.RandomBotAccountCount = 40

# ── world buffs (dynamic keys — substring-matched) ─────────────────
AiPlayerbot.WorldBuff.0.0 = 100,200
AiPlayerbot.WorldBuff.1.0.0 = 300

# ── login criteria (dynamic keys) ──────────────────────────────────
AiPlayerbot.LoginCriteria1 = group
AiPlayerbot.LoginCriteria2 = arena,bg

# ── LLM ─────────────────────────────────────────────────────────────
AiPlayerbot.LLMApiEndpoint = "http://localhost:5001/api/v1/generate"
AiPlayerbot.LLMEnabled = 1
AiPlayerbot.LLMContextLength = 4096

# ── cheats ─────────────────────────────────────────────────────────
AiPlayerbot.BotCheats = "taxi,item"
AiPlayerbot.RndBotCheats = "taxi,gold"

# ── class/race probability ─────────────────────────────────────────
AiPlayerbot.ClassRaceProb.0.1 = 80
AiPlayerbot.ClassRaceProb.2 = 50
AiPlayerbot.ClassRaceProb.2.3 = 25

# ── debug filter (enables the `debug` bool mirror) ─────────────────
AiPlayerbot.DebugFilter = x
