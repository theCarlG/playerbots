name: Rust Tests (no CMaNGOS)

on: [push]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: cargo test (${{ matrix.expansion }})
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        expansion: [vanilla, tbc, wotlk]

    defaults:
      run:
        working-directory: playerbot-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang (for bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            playerbot-rs/target
          key: ${{ runner.os }}-cargo-${{ matrix.expansion }}-${{ hashFiles('playerbot-rs/Cargo.lock', 'playerbot-rs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.expansion }}-

      - name: cargo test --workspace --features ${{ matrix.expansion }}
        run: cargo test --workspace --features ${{ matrix.expansion }}

      - name: cargo clippy --workspace --features ${{ matrix.expansion }} -- -D warnings
        run: cargo clippy --workspace --features ${{ matrix.expansion }} -- -D warnings

  notify:
    name: Send Notification to Discord on Failure
    runs-on: ubuntu-22.04
    permissions:
      contents: none
    needs:
      - rust-tests
    if: failure()

    steps:
      - name: Setup Environmental Variables
        run: |
          echo "GIT_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "GIT_SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - name: Notify
        uses: rjstone/discord-webhook-notify@v1.1.1
        with:
          severity: error
          description: |
            **Rust Tests Failed**
          details: |
            - **Branch:** ${{env.GIT_BRANCH}}
            - **Pusher:** ${{github.event.pusher.name}}
            - **Author:** ${{github.event.head_commit.author.name}}
            - **Commit:** [${{github.repository}}/${{env.GIT_SHORT_SHA}}](${{github.server_url}}/${{ github.repository }}/commit/${{github.sha}})
            - **Build Log:** [actions/runs/${{github.run_id}}](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}})
          footer: CMaNGOS Developers Notified!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
